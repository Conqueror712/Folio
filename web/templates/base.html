<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Folio{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .nav-link { @apply text-sm text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors; }
    .card { @apply bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm; }
    .btn { @apply inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium transition-colors focus:outline-none; }
    .btn-primary { @apply btn bg-indigo-600 hover:bg-indigo-700 text-white; }
    .btn-secondary { @apply btn bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600; }
    .btn-danger { @apply btn bg-red-600 hover:bg-red-700 text-white; }
    .input { @apply w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-400; color: #111827; }
    .label { @apply block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1; }
    .badge { @apply inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium; }
    /* Markdown prose rendering */
    .prose h1,.prose h2,.prose h3 { font-weight: 700; margin: 0.75em 0 0.25em; }
    .prose h2 { font-size: 1rem; color: #1e293b; }
    .prose strong { font-weight: 700; color: #1e293b; }
    .prose p { margin: 0.5em 0; line-height: 1.7; }
    .prose ul,.prose ol { padding-left: 1.25em; margin: 0.4em 0; }
    .prose li { margin: 0.2em 0; }
    .prose code { background: #f1f5f9; padding: 0.1em 0.3em; border-radius: 4px; font-size: 0.85em; }
    .dark .prose strong,.dark .prose h2 { color: #e2e8f0; }
    .dark .prose code { background: #334155; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14">
        <a href="{{ url_for('index') }}" class="flex items-center gap-2 font-bold text-indigo-600 dark:text-indigo-400 text-lg">
          <span>📚</span>
          <span>Folio</span>
        </a>
        <div class="hidden md:flex items-center gap-6">
          <a href="{{ url_for('index') }}" class="nav-link" data-i18n="nav_dashboard">仪表盘</a>
          <a href="{{ url_for('articles') }}" class="nav-link" data-i18n="nav_articles">文章库</a>
          <a href="{{ url_for('feeds') }}" class="nav-link" data-i18n="nav_feeds">订阅源</a>
          <a href="{{ url_for('submit_url') }}" class="nav-link" data-i18n="nav_submit">提交URL</a>
          <a href="{{ url_for('logs') }}" class="nav-link" data-i18n="nav_logs">日志</a>
          <a href="{{ url_for('settings') }}" class="nav-link" data-i18n="nav_settings">设置</a>
        </div>
        <div class="flex items-center gap-2">
          <div class="hidden sm:flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
            <span class="px-2 py-1 bg-indigo-50 dark:bg-indigo-900/30 rounded">
              {{ (status_dict.processed if status_dict is defined else 0) }} <span data-i18n="unit_articles">文章</span>
            </span>
            <span class="px-2 py-1 bg-green-50 dark:bg-green-900/30 rounded">
              {{ (status_dict.feeds if status_dict is defined else 0) }} <span data-i18n="unit_feeds">订阅</span>
            </span>
          </div>
          <!-- Language toggle removed: UI is now fully in Chinese -->
          <!-- Theme toggle -->
          <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="切换主题">
            <span id="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </div>
    <!-- Mobile menu -->
    <div class="md:hidden border-t border-gray-100 dark:border-gray-700 px-4 py-2 flex flex-wrap gap-3 text-sm">
      <a href="{{ url_for('index') }}" class="text-gray-600 dark:text-gray-400" data-i18n="nav_dashboard">仪表盘</a>
      <a href="{{ url_for('articles') }}" class="text-gray-600 dark:text-gray-400" data-i18n="nav_articles">文章库</a>
      <a href="{{ url_for('feeds') }}" class="text-gray-600 dark:text-gray-400" data-i18n="nav_feeds">订阅源</a>
      <a href="{{ url_for('submit_url') }}" class="text-gray-600 dark:text-gray-400" data-i18n="nav_submit">提交URL</a>
      <a href="{{ url_for('logs') }}" class="text-gray-600 dark:text-gray-400" data-i18n="nav_logs">日志</a>
      <a href="{{ url_for('settings') }}" class="text-gray-600 dark:text-gray-400" data-i18n="nav_settings">设置</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-16 py-6 border-t border-gray-200 dark:border-gray-700 text-center text-xs text-gray-400 dark:text-gray-500">
    <p>Generated by Folio · Local Admin UI</p>
  </footer>

  <script>
    // ── Theme ──────────────────────────────────────────────────────────────
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon   = document.getElementById('theme-icon');
    const html        = document.documentElement;

    function applyTheme() {
      const stored = localStorage.getItem('theme') || 'auto';
      if (stored === 'dark' || (stored === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
        themeIcon.textContent = '☀️';
      } else {
        html.classList.remove('dark');
        themeIcon.textContent = '🌙';
      }
    }
    applyTheme();
    themeToggle.addEventListener('click', () => {
      const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
      localStorage.setItem('theme', newTheme);
      applyTheme();
    });

    // ── i18n ───────────────────────────────────────────────────────────────
    const TRANSLATIONS = {
      zh: {
        nav_dashboard: '仪表盘', nav_articles: '文章库', nav_feeds: '订阅源',
        nav_submit: '提交URL', nav_logs: '日志', nav_settings: '设置',
        unit_articles: '文章', unit_feeds: '订阅',
        read_original: '阅读原文', regen_summary: '重新生成摘要', gen_summary: '生成详细摘要',
      },
      en: {
        nav_dashboard: 'Dashboard', nav_articles: 'Articles', nav_feeds: 'Feeds',
        nav_submit: 'Submit URL', nav_logs: 'Logs', nav_settings: 'Settings',
        unit_articles: 'articles', unit_feeds: 'feeds',
        read_original: 'Read Original', regen_summary: 'Regenerate Summary', gen_summary: 'Generate Summary',
      }
    };

    function applyLang(lang) {
      const t = TRANSLATIONS[lang] || TRANSLATIONS.zh;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('lang-label').textContent = lang === 'zh' ? 'EN' : '中';
      html.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
    }

    const langToggle = document.getElementById('lang-toggle');
    let currentLang = localStorage.getItem('lang') || 'zh';
    applyLang(currentLang);
    langToggle.addEventListener('click', () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('lang', currentLang);
      applyLang(currentLang);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
